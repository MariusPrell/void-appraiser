[project]
name = "void-appraiser"
version = "0.8.0"
description = "Zeigt den Platin-Wert von Void-Relikt-Belohnungen (warframe.market)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "onnxruntime",
    "numpy",
    "pillow",
    "mss",
    "pynput",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
void-appraiser = "void_appraiser.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["void_appraiser"]

[tool.setuptools.package-data]
void_appraiser = ["models/*"]
