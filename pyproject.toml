[project]
name = "warframe-helper"
version = "0.4.1"
description = "Zeigt den Platin-Wert von Void-Relikt-Belohnungen (warframe.market)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "rapidocr>=3",
    "onnxruntime",
    "numpy",
    "pillow",
    "mss",
    "pynput",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
warframe-helper = "warframe_helper.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["warframe_helper"]
