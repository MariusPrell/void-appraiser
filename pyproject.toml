[project]
name = "warframe-helper"
version = "0.1.0"
description = "Zeigt den Platin-Wert von Void-Relikt-Belohnungen (warframe.market)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
ocr = ["rapidocr", "onnxruntime"]
dev = ["pytest"]

[project.scripts]
warframe-helper = "warframe_helper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["warframe_helper"]
