# Builds the packages for Windows and Linux.
# Runs on a version tag (e.g. v0.4.0) or manually under "Actions".
# The packages are then available under Actions -> run -> Artifacts,
# and for a tag also as a release with the matching section from CHANGELOG.md.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: void-appraiser-windows.zip
          - os: ubuntu-22.04
            archive: void-appraiser-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux libraries for Qt and pynput
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pyinstaller

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build package
        run: pyinstaller packaging/void-appraiser.spec --noconfirm --distpath dist --workpath build

      - name: Check package (text recognition in the built program)
        shell: bash
        run: |
          exe=dist/void-appraiser/void-appraiser
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --selftest tests/fixtures/rewards-3-cards.png
          "$exe" --selftest tests/fixtures/dialog-axi-z2-radiant.png

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/void-appraiser -DestinationPath ${{ matrix.archive }}

      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C dist void-appraiser

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Release text from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python packaging/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          body_path: release-notes.md
